name: POS native builds
on:
  pull_request:
    paths:
      [
        "apps/pos/**",
        "packages/core/**",
        "pnpm-lock.yaml",
        ".github/workflows/pos-native.yml",
      ]
  push:
    branches: [main]
    paths: ["apps/pos/**", "packages/core/**", "pnpm-lock.yaml"]
concurrency:
  group: pos-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/pos } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec cap sync android
      # Maven Central rate-limits shared runner IPs (HTTP 429). Let Gradle back off
      # longer than its default 3 tries, then one more full attempt after a pause.
      - name: assembleDebug
        working-directory: apps/pos/android
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.repository.max.retries=8
            -Dorg.gradle.internal.repository.initial.backoff=2000
        run: ./gradlew assembleDebug --no-daemon || (sleep 90 && ./gradlew assembleDebug --no-daemon)
  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: apps/pos } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec cap sync ios
      - run: >-
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/pos/ios/App
